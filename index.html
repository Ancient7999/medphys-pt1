<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Physics PT1 · Study</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root {
  --bg: #070a10;
  --bg2: #0c121c;
  --surface: rgba(14, 22, 40, 0.72);
  --border: rgba(34, 211, 238, 0.32);
  --cyan: #22d3ee;
  --cyan-bright: #67e8f9;
  --teal: #2dd4bf;
  --gold: #fbbf24;
  --text: #e8edf5;
  --text-dim: #94a3b8;
  --head: 'Instrument Serif', Georgia, serif;
  --body: 'Outfit', system-ui, sans-serif;
  --mono: 'Space Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  color: var(--text);
  font-family: var(--body);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.12), transparent 55%),
    radial-gradient(900px 500px at 90% 0%, rgba(251,191,36,.08), transparent 50%),
    linear-gradient(180deg, var(--bg), var(--bg2));
}
.shell { max-width: 1100px; margin: 0 auto; padding: 28px 22px 64px; }
.top {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;
  justify-content: space-between; margin-bottom: 22px;
}
.brand h1 {
  margin: 0;
  font-family: var(--head);
  font-weight: 400;
  font-size: clamp(1.8rem, 3.5vw, 2.6rem);
  background: linear-gradient(120deg, var(--cyan-bright), var(--cyan) 40%, var(--teal) 70%, var(--gold));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand .kicker {
  margin: 8px 0 0;
  font-family: var(--mono);
  font-size: .78rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font-family: var(--mono);
  font-size: .82rem;
  color: var(--cyan-bright);
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--cyan) 12%, transparent);
  border-radius: 999px;
  padding: 10px 16px;
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s, border-color .2s, box-shadow .2s, background .2s;
}
.btn:hover {
  transform: translateY(-2px);
  border-color: var(--cyan-bright);
  box-shadow: 0 0 18px rgba(34,211,238,.22);
}
.btn.primary {
  color: #041016;
  background: linear-gradient(120deg, var(--cyan-bright), var(--teal));
  border-color: transparent;
  font-weight: 700;
}
.tabs {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin: 8px 0 18px;
}
.tab {
  font-family: var(--mono);
  font-size: .82rem;
  color: var(--text-dim);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform .2s, border-color .2s, color .2s, background .2s, box-shadow .2s;
}
.tab:hover { transform: translateY(-1px); color: var(--cyan-bright); border-color: var(--cyan); }
.tab.active {
  color: var(--cyan-bright);
  border-color: var(--cyan);
  background: color-mix(in srgb, var(--cyan) 14%, transparent);
  box-shadow: 0 0 20px rgba(34,211,238,.18);
}
.panel {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 28px 26px;
  backdrop-filter: blur(14px);
  box-shadow: 0 18px 40px -16px rgba(0,0,0,.55);
  min-height: 50vh;
}
.status {
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--text-dim);
  margin-bottom: 14px;
}
.md { line-height: 1.65; font-size: 1.05rem; }
.md h1, .md h2, .md h3, .md h4 {
  font-family: var(--head);
  font-weight: 400;
  line-height: 1.25;
  margin: 1.4em 0 .55em;
}
.md h1 { font-size: 2rem; margin-top: 0; }
.md h2 { font-size: 1.55rem; color: var(--cyan-bright); }
.md h3 { font-size: 1.25rem; color: var(--gold); }
.md p, .md li { color: var(--text); }
.md a { color: var(--cyan-bright); }
.md code, .md pre {
  font-family: var(--mono);
  font-size: .9em;
}
.md code {
  background: rgba(0,0,0,.35);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: .1em .35em;
}
.md pre {
  background: rgba(0,0,0,.42);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  overflow-x: auto;
  white-space: pre-wrap;
}
.md pre code { background: none; border: none; padding: 0; }
.md table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
  font-size: .95rem;
  overflow-x: auto;
  display: block;
}
.md th, .md td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
}
.md th {
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--gold);
  background: rgba(0,0,0,.28);
}
.md blockquote {
  margin: 1em 0;
  padding: .2em 0 .2em 1em;
  border-left: 3px solid var(--gold);
  color: var(--text-dim);
}
.md hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.6em 0;
}
.md strong { color: #fff; }
.foot {
  margin-top: 18px;
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--text-dim);
  opacity: .75;
}
@media (max-width: 640px) {
  .panel { padding: 20px 16px; }
  .brand h1 { font-size: 1.7rem; }
}
</style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Medical Physics · Periodic Test 1</h1>
        <p class="kicker">Study portal · chapters 1–3 through Bernoulli</p>
      </div>
      <div class="actions">
        <a class="btn primary" href="quiz/index.html">Open Quiz Portal</a>
        <button class="btn" type="button" id="fsBtn">Fullscreen</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Chapters">
      <button class="tab active" type="button" role="tab" data-src="content/chapter-1.md" data-label="Chapter 1" aria-selected="true">Chapter 1 · Matter &amp; mechanics</button>
      <button class="tab" type="button" role="tab" data-src="content/chapter-2.md" data-label="Chapter 2" aria-selected="false">Chapter 2 · Fluids at rest</button>
      <button class="tab" type="button" role="tab" data-src="content/chapter-3.md" data-label="Chapter 3" aria-selected="false">Chapter 3 · Flow → Bernoulli</button>
    </nav>

    <section class="panel">
      <div class="status" id="status">Loading chapter…</div>
      <article class="md" id="content"></article>
    </section>
    <p class="foot">Fonts: Instrument Serif / Outfit / Space Mono (Hooke practical design tokens only). Quiz bank: data/bank.json (198 items). Serve over http(s) or GitHub Pages so fetch works.</p>
  </div>

<script>
const contentEl = document.getElementById('content');
const statusEl = document.getElementById('status');
const cache = Object.create(null);

function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/** Lightweight Markdown → HTML (headings, lists, tables, code, emphasis). Polish later. */
function renderMarkdown(md){
  const lines = md.replace(/\r\n/g,'\n').split('\n');
  const out = [];
  let i = 0;
  let inCode = false;
  let codeBuf = [];
  let listType = null;

  function closeList(){
    if(listType){ out.push(listType === 'ol' ? '</ol>' : '</ul>'); listType = null; }
  }

  function inline(t){
    t = escapeHtml(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return t;
  }

  while(i < lines.length){
    const line = lines[i];

    if(line.startsWith('```')){
      if(inCode){
        out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
        codeBuf = []; inCode = false;
      } else {
        closeList();
        inCode = true;
      }
      i++; continue;
    }
    if(inCode){ codeBuf.push(line); i++; continue; }

    if(/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*[-:| ]+\|/.test(lines[i+1])){
      closeList();
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){
        const cells = lines[i].trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
        rows.push(cells);
        i++;
        if(i < lines.length && /^\s*\|?\s*[-:| ]+\|/.test(lines[i]) && rows.length === 1){
          i++; // skip separator
        } else if(rows.length > 1 && i < lines.length && /^\s*\|?\s*[-:| ]+\|/.test(lines[i])){
          i++;
        } else if(!/^\s*\|/.test(lines[i] || '')){
          break;
        }
      }
      if(rows.length){
        let html = '<table><thead><tr>' + rows[0].map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
        for(let r = 1; r < rows.length; r++){
          html += '<tr>' + rows[r].map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        }
        html += '</tbody></table>';
        out.push(html);
      }
      continue;
    }

    if(/^---+\s*$/.test(line)){ closeList(); out.push('<hr>'); i++; continue; }

    const hm = /^(#{1,4})\s+(.*)$/.exec(line);
    if(hm){
      closeList();
      const level = hm[1].length;
      out.push('<h' + level + '>' + inline(hm[2]) + '</h' + level + '>');
      i++; continue;
    }

    const ul = /^\s*[-*]\s+(.*)$/.exec(line);
    if(ul){
      if(listType !== 'ul'){ closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
      i++; continue;
    }
    const ol = /^\s*\d+\.\s+(.*)$/.exec(line);
    if(ol){
      if(listType !== 'ol'){ closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>');
      i++; continue;
    }

    if(!line.trim()){ closeList(); i++; continue; }

    closeList();
    out.push('<p>' + inline(line) + '</p>');
    i++;
  }
  closeList();
  if(inCode) out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
  return out.join('\n');
}

async function loadChapter(src, label){
  statusEl.textContent = 'Loading ' + label + '…';
  try{
    if(!cache[src]){
      const res = await fetch(src, { cache: 'no-store' });
      if(!res.ok) throw new Error(src + ' → ' + res.status);
      cache[src] = await res.text();
    }
    contentEl.innerHTML = renderMarkdown(cache[src]);
    statusEl.textContent = label + ' · from ' + src;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }catch(err){
    contentEl.innerHTML = '<p><strong>Could not load chapter.</strong></p><p>Serve this folder over http(s) or GitHub Pages so <code>fetch</code> can read Markdown. file:// is usually blocked.</p><pre><code>' + escapeHtml(String(err)) + '</code></pre>';
    statusEl.textContent = 'Load failed';
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t === tab);
      t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
    });
    loadChapter(tab.dataset.src, tab.dataset.label);
  });
});

document.getElementById('fsBtn').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

const first = document.querySelector('.tab.active');
loadChapter(first.dataset.src, first.dataset.label);
</script>
</body>
</html>
