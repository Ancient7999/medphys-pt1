<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Physics · Periodic Test 1</title>
<link rel="stylesheet" href="css/theme-vars.css">
<link rel="stylesheet" href="css/colorizer.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="ps2-home" class="ps2-screen">
  <h1 class="ps2-title">Medical Physics · Periodic Test 1</h1>
  <div class="ps2-menu" role="menu">
    <button type="button" class="ps2-menu-item hero" id="menuQuiz" role="menuitem">
      <span class="ps2-icon">⚔</span>
      <span class="ps2-label">Quiz Interface
        <span class="ps2-sub">Practice bank · categories, forms, mixture</span>
      </span>
    </button>
    <button type="button" class="ps2-menu-item quiet" id="menuStudy" role="menuitem">
      <span class="ps2-icon">📖</span>
      <span class="ps2-label">Study Interface
        <span class="ps2-sub">Chapters 1–3 · folded until opened</span>
      </span>
    </button>
    <button type="button" class="ps2-menu-item neutral" id="menuOptions" role="menuitem">
      <span class="ps2-icon">⚙</span>
      <span class="ps2-label">Options
        <span class="ps2-sub">Accent presets · color strength · theme</span>
      </span>
    </button>
  </div>
  <div class="ps2-tip-bar">
    <kbd>↑</kbd><kbd>↓</kbd> Navigate
    <span class="tip-sep">·</span>
    <kbd>Enter</kbd> Select
    <span class="tip-sep">·</span>
    <kbd>Esc</kbd> Back
  </div>
</div>

<div id="ps2-options" class="ps2-screen" style="display:none; justify-content:flex-start; padding-top:48px;">
  <button type="button" class="ps2-back-btn" id="optionsBack">← Back</button>
  <h2 class="ps2-title" style="font-size:clamp(1.4rem,3vw,2rem); margin:0 0 22px; animation:none;">Options</h2>
  <div class="options-mount" id="colorizer-mount">
    <div class="settings-panel-title">Theme · Colorizer</div>
    <!-- Copied from assets/colorizer-panel.fragment.html (unchanged controls / IDs) -->
<div class="setting-item" style="padding-top:20px; position:relative;">
<div style="font-size:0.75em; font-weight:bold; color:var(--col-text-muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:16px; opacity:0.6;">Theme</div>
<button title="Reset Theme to Defaults" onclick="resetThemeToDefaults()" style="position:absolute; top:20px; right:0; background:transparent; border:1px solid var(--col-error); color:var(--col-error); border-radius:6px; padding:3px 8px; font-size:0.8em; ">↺</button>
<span class="setting-item-label">Accent Color</span>
<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
<div class="preset-swatches" style="margin:0; flex-shrink:0;">
<button class="preset-swatch" data-hex="#00bbcc" style="background:#00bbcc;" title="Cyan" onclick="applyPreset('#00bbcc', false)"></button>
<button class="preset-swatch" data-hex="#8833ff" style="background:#8833ff;" title="Violet" onclick="applyPreset('#8833ff', false, 32)"></button>
<button class="preset-swatch" data-hex="#000000" style="background:#000000;" title="Obsidian" onclick="applyPreset('#000000', false, 90)"></button>
<button class="preset-swatch" data-hex="#ff8800" style="background:#ff8800;" title="Amber" onclick="applyPreset('#ff8800', false)"></button>
<button class="preset-swatch" data-hex="#ff0000" style="background:#ff0000;" title="Red" onclick="applyPreset('#ff0000', false, 32)"></button>
</div>
<div id="custom-presets-area" style="display:flex;gap:6px;align-items:center;"></div>
<div id="theme-lock-colorPicker" style="display:flex; gap:8px; align-items:center; margin-left:auto;">
<input type="color" id="accent-color-picker" value="#FF8800" style="width:40px;height:40px;border:none;border-radius:8px;flex-shrink:0;">
<input type="text" id="accent-hex-input" value="#FF8800" maxlength="7" class="number-input" style="width:100px; font-family:monospace; font-size:0.85em;">
</div>
</div>
</div>
<div class="setting-item" id="theme-lock-colorStrength" style="border-top:1px solid var(--col-border-light); padding-top:20px;">
<span class="setting-item-label">Color Strength: <span id="strength-value-display" style="color:var(--accent-0);">64</span></span>
<div style="display:flex; gap:10px; align-items:center;">
<span style="font-size:0.82em; color:var(--col-text-muted);">Subtle</span>
<input type="range" id="accent-strength-slider" min="0" max="100" value="64" style="flex:1; ">
<span style="font-size:0.82em; color:var(--col-text-muted);">Vibrant</span>
</div>
</div>
<div class="setting-item" style="border-top:1px solid var(--col-border-light); padding-top:20px; display:none;">
<span class="setting-item-label">Reset Theme</span>
<button class="btn btn-secondary" style="border-color:var(--col-error); color:var(--col-error);" onclick="resetThemeToDefaults()">Reset Theme to Defaults</button>
<p class="setting-item-desc">Resets accent color, hue shift, and dark mode.</p>
</div>
<div class="setting-item" style="display: none;">
<span class="setting-item-label">Appearance</span>
<div class="toggle-container" style="margin:0; justify-content:flex-start;">
<span class="toggle-label">Dark</span>
<label class="toggle-switch">
<input type="checkbox" id="light-mode-toggle">
<span class="toggle-slider"></span>
</label>
<span class="toggle-label">Light</span>
</div>
</div>
  </div>
</div>

<script src="js/particles.js"></script>
<script src="js/colorizer-theme.js"></script>
<script>
(function(){
  var home = document.getElementById('ps2-home');
  var options = document.getElementById('ps2-options');
  var items = Array.prototype.slice.call(document.querySelectorAll('#ps2-home .ps2-menu-item'));
  var focusIdx = 0;

  function showHome(){
    home.style.display = 'flex';
    options.style.display = 'none';
    updateFocus();
  }
  function showOptions(){
    home.style.display = 'none';
    options.style.display = 'flex';
  }
  function updateFocus(){
    items.forEach(function(el, i){
      el.classList.toggle('focused', i === focusIdx);
    });
  }

  document.getElementById('menuQuiz').addEventListener('click', function(){
    window.location.href = 'quiz/index.html';
  });
  document.getElementById('menuStudy').addEventListener('click', function(){
    window.location.href = 'study.html';
  });
  document.getElementById('menuOptions').addEventListener('click', showOptions);
  document.getElementById('optionsBack').addEventListener('click', showHome);

  document.addEventListener('keydown', function(e){
    if(options.style.display !== 'none' && options.style.display !== ''){
      if(e.key === 'Escape'){ e.preventDefault(); showHome(); }
      return;
    }
    if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){
      e.preventDefault(); focusIdx = (focusIdx + 1) % items.length; updateFocus();
    } else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
      e.preventDefault(); focusIdx = (focusIdx - 1 + items.length) % items.length; updateFocus();
    } else if(e.key === 'Enter'){
      e.preventDefault(); if(items[focusIdx]) items[focusIdx].click();
    }
  });

  items.forEach(function(el, i){
    el.addEventListener('mouseenter', function(){ focusIdx = i; updateFocus(); });
  });
  updateFocus();
})();
</script>
</body>
</html>
